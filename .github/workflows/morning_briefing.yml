name: Morning Briefing Orchestrator

on:
  schedule:
    - cron: '15 12 * * 1-5' # 8:15 AM ET (12:15 UTC) Monday-Friday
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: 'github-downloader@plucky-shore-510217-c6.iam.gserviceaccount.com'

      - name: Run Orchestrator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          # The orchestrator runs the full pipeline
          python scripts/orchestrator.py
